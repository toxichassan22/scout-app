name: 🚀 Auto Deploy to Tencent Cloud

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 📦 Install server dependencies
        run: npm --prefix server ci

      - name: 🔧 Generate Prisma client
        run: npm --prefix server run prisma:generate

      - name: 🧹 Lint server
        run: npm --prefix server run lint

      - name: 🧪 Run server tests
        run: npm --prefix server test
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: ci-test-secret-only-not-for-production

  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 🔗 Connect to Server & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            chmod +x /var/www/scout-app/deploy.sh
            /var/www/scout-app/deploy.sh

      - name: ✅ Deploy Success Notification
        run: echo "✅ تم نشر التحديث بنجاح على السيرفر!"
