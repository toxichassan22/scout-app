name: 🚀 Auto Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  # Allows redeploying the current main without an empty commit, which is needed
  # after changing a repository secret or variable since those are only read at run time.
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 📦 Install server dependencies
        run: npm --prefix server ci

      - name: 🔧 Generate Prisma client
        run: npm --prefix server run prisma:generate

      - name: 🔍 Check migration drift
        working-directory: server
        env:
          DATABASE_URL: file:./test.db
          SHADOW_DATABASE_URL: file:./shadow.db
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: 🧹 Lint server
        run: npm --prefix server run lint

      - name: 🧪 Run server tests
        run: npm --prefix server test
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: ci-test-secret-only-not-for-production

  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 🔗 Connect to Server & Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          BOOTSTRAP_ADMIN: ${{ secrets.BOOTSTRAP_ADMIN }}
          INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          # Empty values are ignored by ensure-env.mjs, which keeps the deployed token.
          AI_CHAT_TOKEN: ${{ secrets.AI_CHAT_TOKEN }}
          AI_CHAT_TOKEN_POOL: ${{ secrets.AI_CHAT_TOKEN_POOL || vars.AI_CHAT_TOKEN_POOL }}
          AI_CHAT_URL: ${{ vars.AI_CHAT_URL }}
          AI_CHAT_MODEL: ${{ vars.AI_CHAT_MODEL }}
          # Optional non-secret pool controls; empty values preserve the server settings.
          AI_RATE_MAX: ${{ vars.AI_RATE_MAX }}
          AI_KEY_RPM: ${{ vars.AI_KEY_RPM }}
          AI_GLOBAL_RPM: ${{ vars.AI_GLOBAL_RPM }}
          AI_KEY_MIN_INTERVAL_MS: ${{ vars.AI_KEY_MIN_INTERVAL_MS }}
          AI_GLOBAL_MIN_INTERVAL_MS: ${{ vars.AI_GLOBAL_MIN_INTERVAL_MS }}
          AI_POOL_CONCURRENCY: ${{ vars.AI_POOL_CONCURRENCY }}
          AI_MAX_QUEUE: ${{ vars.AI_MAX_QUEUE }}
          AI_PROVIDER_TIMEOUT_MS: ${{ vars.AI_PROVIDER_TIMEOUT_MS }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS }}
          # Off-box backups. Unset values keep whatever the server already has.
          # GitHub rejects secret and variable names beginning with GITHUB_, so the
          # private repo settings are stored under these aliases and ensure-env.mjs
          # translates them.
          # Read from either store so it does not matter whether a value was added
          # under Secrets or Variables.
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN || vars.BACKUP_REPO_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY || vars.BACKUP_ENCRYPTION_KEY }}
          BACKUP_REPO: ${{ vars.BACKUP_REPO || secrets.BACKUP_REPO }}
          BACKUP_REPO_BRANCH: ${{ vars.BACKUP_REPO_BRANCH || secrets.BACKUP_REPO_BRANCH }}
          BACKUP_REPO_PATH: ${{ vars.BACKUP_REPO_PATH || secrets.BACKUP_REPO_PATH }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL || vars.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_BEARER_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_BEARER_TOKEN || vars.GDRIVE_WEBHOOK_BEARER_TOKEN }}
          GDRIVE_WEBHOOK_SIGNING_SECRET: ${{ secrets.GDRIVE_WEBHOOK_SIGNING_SECRET || vars.GDRIVE_WEBHOOK_SIGNING_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: BOOTSTRAP_ADMIN,INITIAL_ADMIN_USERNAME,INITIAL_ADMIN_PASSWORD,AI_CHAT_TOKEN,AI_CHAT_TOKEN_POOL,AI_CHAT_URL,AI_CHAT_MODEL,AI_RATE_MAX,AI_KEY_RPM,AI_GLOBAL_RPM,AI_KEY_MIN_INTERVAL_MS,AI_GLOBAL_MIN_INTERVAL_MS,AI_POOL_CONCURRENCY,AI_MAX_QUEUE,AI_PROVIDER_TIMEOUT_MS,AI_MAX_OUTPUT_TOKENS,BACKUP_REPO_TOKEN,BACKUP_ENCRYPTION_KEY,BACKUP_REPO,BACKUP_REPO_BRANCH,BACKUP_REPO_PATH,GDRIVE_WEBHOOK_URL,GDRIVE_WEBHOOK_BEARER_TOKEN,GDRIVE_WEBHOOK_SIGNING_SECRET
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            chmod +x /var/www/scout-app/deploy.sh
            /var/www/scout-app/deploy.sh

      - name: ✅ Deploy Success Notification
        run: echo "✅ تم نشر التحديث بنجاح على السيرفر!"
